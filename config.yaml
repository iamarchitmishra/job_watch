  #   LTIMindtree, Publicis Sapient, EPAM, Turnitin, Checkout.com
  # Rippling: ats.rippling.com/rippling
  # Own portals: Flipkart, Amazon (amazon.jobs), Myntra (careers.myntra.com; old Greenhouse board is gone),
