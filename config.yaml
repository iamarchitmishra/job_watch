  #   Atlassian, Uber, Google, Microsoft, Intuit | Bloomberg: Avature | LinkedIn: use LinkedIn job alerts
  # JioHotstar (JioStar): old Lever board jobs.lever.co/jiostar is gone (404); current portal unknown
  # Workday, config not verified yet: NVIDIA, PayPal, Walmart (no "Country" facet / 422 on first try)
  # Supported but few India roles: Twilio, Airbnb, GitLab, Elastic, Datadog (greenhouse); Grab (smartrecruiters)

filters:
  title_include:
    - software engineer
    - software developer
    - software development engineer
    - sde
    - backend
    - back end
    - member of technical staff   # Salesforce MTS / SMTS
    - mts
    - ai engineer
    - ml engineer
    - machine learning engineer
    - python
  # Matching is case-insensitive and whole-word. Exclude beats include.
  # A company can adjust these lists with its own `filters:` block:
  #   title_include_add, title_exclude_add, title_exclude_remove
  title_exclude:
    - intern
    - new grad
    - graduate
    - staff
    - principal
    - architect
    - lead
    - manager
    - director
    - vp
    - head of
    - frontend
    - front end
    - ios
    - android
    - qa
    - sdet
    - test
  # Anywhere in India (office or remote). City names are needed because some
  # boards list only cities (e.g. "Bengaluru; Gurugram; Hyderabad").
  # "Remote - US" fails because it mentions none of these.
  locations:
    india:
      - india
      - bangalore
      - bengaluru
      - gurgaon
      - gurugram
      - noida
      - delhi
      - hyderabad
      - pune
      - mumbai
      - chennai
      - kolkata
      - ahmedabad
      - jaipur
      - kochi
      - trivandrum
      - thiruvananthapuram
      - coimbatore
      - chandigarh
      - mohali
      - indore
      # states, for boards that only give a state ("tamil nadu")
      - karnataka
      - telangana
      - maharashtra
      - tamil nadu
      - haryana
      - uttar pradesh
      - kerala
      - gujarat
      - west bengal

first_run:
  lookback_days: 7
  max_digest_size: 100
