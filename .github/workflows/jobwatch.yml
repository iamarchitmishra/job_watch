name: job-watch

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Run job-watch
        run: python -m jobwatch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f seen.json ]; then git add seen.json; fi
          if git diff --cached --quiet; then
            echo "seen.json unchanged"
          else
            git commit -m "Update seen.json ($(date -u +%F))"
            git push
          fi
